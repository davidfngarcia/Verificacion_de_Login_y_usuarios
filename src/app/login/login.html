<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 space-y-6">
    
    <!-- Encabezado / Logo -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Iniciar sesión</h2>
      <p class="text-sm text-slate-500">Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <!-- Formulario -->
    <form class="space-y-5" (ngSubmit)="onSubmit()">
      
      <!-- Campo Usuario -->
      <div class="space-y-1.5">
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
          Usuario
        </label>
        <input
          id="username"
          type="text"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm font-medium"
          placeholder="jperez"
          [(ngModel)]="username"
          name="username"
          required
        />
      </div>

      <!-- Campo Contraseña -->
      <div class="space-y-1.5">
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm font-medium"
          placeholder="••••••••"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMessage" class="p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium rounded-xl flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Botón Ingresar -->
      <button 
        type="submit" 
        [disabled]="loading"
        class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-60 text-white font-medium py-3 rounded-xl shadow-sm transition-all duration-150 cursor-pointer text-sm">
        
        <!-- Spinner animado si está cargando -->
        <svg *ngIf="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>

        <span>{{ loading ? 'Ingresando...' : 'Ingresar' }}</span>
      </button>

    </form>
  </div>
</div>
