<!-- Modal Container Header -->
<div class="flex items-center justify-between p-6 border-b border-slate-100 bg-slate-50/50 rounded-t-2xl">
  <div>
    <h3 class="text-lg font-bold text-slate-800 tracking-tight">Crear nuevo usuario</h3>
    <p class="text-xs text-slate-500 mt-0.5">Ingresa los datos para registrar un acceso al sistema.</p>
  </div>

  <button type="button" (click)="cancelar()"
    class="w-8 h-8 rounded-xl bg-white border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors flex items-center justify-center cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </button>
</div>

<!-- Modal Body -->
<div class="p-6 bg-white rounded-b-2xl">
  <form (ngSubmit)="onSubmit()" class="space-y-4" *ngIf="!successMessage">


    <!-- Campo Username -->
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
        Username
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm font-medium">&#64;</span>
        <input type="text"
          class="w-full pl-8 pr-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm font-medium"
          placeholder="juanperez" [(ngModel)]="username" name="username" required />
      </div>
    </div>

    <!-- Campo Password -->
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
        Contraseña
      </label>
      <input type="password"
        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm font-medium"
        placeholder="••••••••" [(ngModel)]="password" name="password" required />
    </div>

    <!-- Alerta de Error -->
    <div *ngIf="errorMessage"
      class="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium rounded-xl flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Botones de Acción -->
    <div class="pt-3 flex items-center justify-end gap-3">
      <button type="button" (click)="cancelar()"
        class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium text-sm transition-colors cursor-pointer">
        Cancelar
      </button>

      <button type="submit" [disabled]="loading"
        class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-60 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm transition-all text-sm cursor-pointer">

        <svg *ngIf="loading" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>

        <span>{{ loading ? 'Guardando...' : 'Guardar usuario' }}</span>
      </button>
    </div>

  </form>

  <div *ngIf="successMessage"
    class="p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-medium rounded-xl flex items-center gap-2">
    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span>{{ successMessage }}</span>
  </div>
</div>
